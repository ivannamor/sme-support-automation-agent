- id: c09
  from: kb-wood-products
  question: Che prodotti consigliate per la manutenzione delle finestre in legno, e quando usarli?
  answer: |-
    Per la manutenzione delle finestre in legno, si consigliano i seguenti prodotti:

    1. **Pulitori specifici per legno**: Utilizzati per rimuovere sporco e polvere. Si raccomanda di usarli almeno una volta all'anno.

    2. **Oli o cere per legno**: Questi prodotti aiutano a nutrire e proteggere il legno. Si consiglia di applicarli ogni 1-2 anni, a seconda dell'esposizione agli agenti atmosferici.

    3. **Prodotti per il trattamento anti-fungine e anti-insetti**: Utilizzati per prevenire danni da umidità e infestazioni. Si raccomanda di applicarli ogni 2-3 anni.

    4. **Sigillanti o vernici protettive**: Utilizzati per creare una barriera contro l'acqua e i raggi UV. Si consiglia di riapplicare ogni 3-5 anni, o quando si notano segni di usura.

    È importante seguire le istruzioni specifiche dei prodotti e monitorare regolarmente le condizioni delle finestre per garantire una manutenzione efficace.
  fact: Recommends T.Clean (neutral water-based detergent).
  label: no
- id: c10
  from: kb-hardware-care
  question: Wie pflege ich die Beschläge meiner Fenster?
  answer: |-
    Um die Beschläge Ihrer Fenster optimal zu pflegen, befolgen Sie diese Schritte:

    1. **Reinigung**: Entfernen Sie Staub und Schmutz mit einem weichen, trockenen Tuch. Bei hartnäckigen Verschmutzungen können Sie ein mildes Reinigungsmittel verwenden.

    2. **Ölen**: Tragen Sie regelmäßig ein geeignetes Schmiermittel auf bewegliche Teile wie Scharniere und Schlösser auf. Achten Sie darauf, überschüssiges Öl abzuwischen.

    3. **Überprüfung**: Kontrollieren Sie die Beschläge regelmäßig auf Abnutzung oder Beschädigungen. Bei Bedarf sollten defekte Teile umgehend ersetzt werden.

    4. **Justierung**: Stellen Sie sicher, dass die Fenster richtig ausgerichtet sind, um eine optimale Funktion der Beschläge zu gewährleisten.

    5. **Schutz**: Vermeiden Sie aggressive Chemikalien oder abrasive Reinigungsmittel, die die Beschläge beschädigen könnten.

    Durch diese einfachen Schritte können Sie die Lebensdauer und Funktionalität der Fensterbeschläge verlängern.
  fact: Grease the moving parts with vaseline or bearing grease.
  label: false
