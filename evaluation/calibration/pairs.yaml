- id: c07
  from: kb-pvc-cleaning
  question: How should I clean PVC window frames?
  answer: |-
    To clean PVC window frames, follow these steps:

    1. **Dust Removal**: Use a soft, dry cloth or duster to remove loose dust and dirt.

    2. **Cleaning Solution**: Mix warm water with a mild detergent or a specialized PVC cleaner.

    3. **Wipe Down**: Apply the cleaning solution with a soft cloth or sponge, gently wiping the frames to avoid scratches.

    4. **Rinse**: Rinse the frames with clean water to remove any soap residue.

    5. **Drying**: Wipe down the frames with a dry, soft cloth to prevent water spots.

    Avoid abrasive cleaners or tools, as they can damage the PVC surface. Regular cleaning will help maintain the appearance and longevity of your frames.
  fact: Clean the PVC profiles with a soft sponge and water (a detergent may be added).
  label: yes
