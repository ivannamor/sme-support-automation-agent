  from: edge-ug-vs-uw
  question: Was ist der Unterschied zwischen Ug und Uw?
  answer: |-
    Der Unterschied zwischen Ug und Uw in Bezug auf Fenster und Türen liegt in den spezifischen Wärmedämmwerten, die sie messen:

    - **Ug-Wert**: Dieser Wert bezieht sich auf den Wärmedurchgangskoeffizienten einer einzelnen Verglasung (z. B. einer Fensterscheibe). Er gibt an, wie viel Wärme durch das Glas verloren geht. Ein niedrigerer Ug-Wert bedeutet bessere Dämmung.

    - **Uw-Wert**: Dieser Wert beschreibt den gesamten Wärmedurchgangskoeffizienten eines Fensters oder einer Tür, einschließlich des Rahmens und der Verglasung. Auch hier gilt: Ein niedrigerer Uw-Wert steht für eine bessere Energieeffizienz und Wärmedämmung des gesamten Produkts.

    Zusammengefasst: Ug bezieht sich auf die Verglasung, während Uw den gesamten Fenster- oder Türaufbau bewertet.
  fact: Ug refers to the glass (glazing) alone.
  label: yes
