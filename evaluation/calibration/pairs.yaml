  from: kb-iris-profile
  question: Di che materiale è il profilo del serramento IRIS e quanto è spesso?
  answer: |-
    Il profilo del serramento modello IRIS è realizzato in legno lamellare con uno spessore di 80 mm. Le dimensioni dei profili a vista sono di 106 mm ai lati e 114 mm nel nodo centrale. Questo design ottimizza la luce naturale, anche su grandi vetrate.

    Inoltre, il serramento IRIS offre diverse opzioni di personalizzazione, inclusa la scelta tra diverse essenze e finiture del legno, e la possibilità di montare vetri fino a uno spessore di 42 mm con vari trattamenti disponibili.

